name: Release

# 推 v 开头的 tag 才发布；手动触发只用来复现打包问题
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 建 Release、传安装包要能写仓库内容，只有这一步需要这个权限
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 只认 package-lock.json，装出来的版本和本机一致
      - name: 装前端依赖
        run: npm ci

      # tauri build 先跑 beforeBuildCommand（tsc && vite build），再去 GitHub 下 WiX 和 NSIS。
      # 日志本体要 token 才能下，所以失败时把尾巴写成 annotation —— 那个接口匿名可读。
      - name: 编译并打包
        shell: bash
        run: |
          if npm run tauri build > build.log 2>&1; then
            tail -20 build.log
            exit 0
          fi
          echo "--- 打包失败，最后 40 行 ---"
          tail -40 build.log
          tail -12 build.log | sed 's/%/%25/g' | while IFS= read -r line; do
            echo "::error::${line%$'\r'}"
          done
          exit 1

      # 失败也要留日志，网页里能直接下载
      - name: 存日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      # 产物路径：MSI 在 bundle/msi，NSIS 在 bundle/nsis
      - name: 发布 Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe)
          test "${#files[@]}" -gt 0 || { echo "没找到安装包"; exit 1; }
          ls -l "${files[@]}"
          # 同一个 tag 重跑时 Release 已存在，改成覆盖资产
          gh release create "$TAG" --generate-notes --title "$TAG" "${files[@]}" \
            || gh release upload "$TAG" --clobber "${files[@]}"
