name: Release

# 推 v 开头的 tag 才发布；手动触发只用来复现打包问题
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 建 Release、传安装包要能写仓库内容，只有这一步需要这个权限
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 只认 package-lock.json，装出来的版本和本机一致
      - name: 装前端依赖
        run: npm ci

      # CONTRIBUTING 那四道门，tauri build 只自带 tsc + vite build 这两道（beforeBuildCommand）。
      # 单测和 clippy 在这儿补上：否则 Rust 侧的逻辑回归能一路打进 Release。
      # 不加 `-D warnings`：runner 上的工具链比本机新，新 clippy 规则只会让发版莫名变红。
      - name: 后端单测与 clippy
        shell: bash
        run: |
          cd src-tauri
          cargo test
          cargo clippy --all-targets

      # tauri build 先跑 beforeBuildCommand（tsc && vite build），再去 GitHub 下 WiX 和 NSIS。
      # 日志本体要 token 才能下，所以失败时把尾巴写成 annotation —— 那个接口匿名可读。
      - name: 编译并打包
        shell: bash
        run: |
          if npm run tauri build > build.log 2>&1; then
            tail -20 build.log
            exit 0
          fi
          echo "--- 打包失败，最后 40 行 ---"
          tail -40 build.log
          tail -12 build.log | sed 's/%/%25/g' | while IFS= read -r line; do
            echo "::error::${line%$'\r'}"
          done
          exit 1

      # 失败也要留日志，网页里能直接下载
      - name: 存日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      # 产物路径：MSI 在 bundle/msi，NSIS 在 bundle/nsis
      - name: 发布 Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          built=(src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe)
          test "${#built[@]}" -gt 0 || { echo "没找到安装包"; exit 1; }

          # GitHub 会把资产名里的非 ASCII 字符抹掉：个人工作台_1.0.1_x64-setup.exe 传上去变成
          # _1.0.1_x64-setup.exe，跟正文里的文件名对不上，照着核对的人会以为哈希错了。
          # 所以上传前先把开头的产品名换成 workbench，校验表也算这份改过名的文件。
          mkdir -p upload
          files=()
          for f in "${built[@]}"; do
            base=$(basename "$f")
            to="upload/workbench_${base#*_}"
            cp "$f" "$to"
            files+=("$to")
          done
          ls -l "${files[@]}"

          {
            echo "Windows x64 安装包。需要 Microsoft Edge WebView2 运行时（Win10 1803+ / Win11 自带）。"
            echo
            echo '- 文件名带 -setup.exe 的是 NSIS 单文件安装程序，静默安装加 /S'
            echo '- 文件名带 .msi 的是 Windows Installer 包，msiexec /i 包名.msi /qn 可无人值守部署'
            echo
            echo '数据和设置都在 %APPDATA%\workbench\ 下，卸载程序不会替你删它。'
            echo
            echo '应用名是中文的「个人工作台」，但安装包文件名用 ASCII：GitHub 会删掉资产名里的非 ASCII 字符，'
            echo '中文名传上去只会剩个下划线开头。双击安装出来的程序名、开始菜单项都还是中文，不受影响。'
            echo
            echo "## SHA-256"
            echo
            echo '```'
            for f in "${files[@]}"; do
              printf '%s  %s\n' "$(sha256sum "$f" | cut -d" " -f1)" "$(basename "$f")"
            done
            echo '```'
            echo
            echo '源码构建：npm ci，然后 npx tauri build，产物在 src-tauri/target/release/bundle 下。'
          } > release-notes.md
          cat release-notes.md

          # 重跑同一个 tag 时 Release 已存在：create 失败不算错，后面覆盖资产、改说明
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md || true
          # 清掉早先传上去的中文名资产（改名规则之前的产物），免得一次重跑留两份
          for old in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
            case "$old" in
              workbench_*) ;;
              *) gh release delete-asset "$TAG" "$old" --yes ;;
            esac
          done
          gh release upload "$TAG" --clobber "${files[@]}"
          gh release edit "$TAG" --notes-file release-notes.md
