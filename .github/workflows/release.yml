name: Release

# 推 v 开头的 tag 才发布；手动触发只用来复现打包问题
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 建 Release、传安装包要能写仓库内容，只有这一步需要这个权限
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 只认 package-lock.json，装出来的版本和本机一致
      - name: 装前端依赖
        run: npm ci

      # tauri build 先跑 beforeBuildCommand（tsc && vite build），再去 GitHub 下 WiX 和 NSIS。
      # 日志本体要 token 才能下，所以失败时把尾巴写成 annotation —— 那个接口匿名可读。
      - name: 编译并打包
        shell: bash
        run: |
          if npm run tauri build > build.log 2>&1; then
            tail -20 build.log
            exit 0
          fi
          echo "--- 打包失败，最后 40 行 ---"
          tail -40 build.log
          tail -12 build.log | sed 's/%/%25/g' | while IFS= read -r line; do
            echo "::error::${line%$'\r'}"
          done
          exit 1

      # 失败也要留日志，网页里能直接下载
      - name: 存日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      # 产物路径：MSI 在 bundle/msi，NSIS 在 bundle/nsis
      - name: 发布 Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe)
          test "${#files[@]}" -gt 0 || { echo "没找到安装包"; exit 1; }
          ls -l "${files[@]}"

          # 校验和现场算：写死等于把本次构建没产出的东西也说成产出了
          {
            echo "Windows x64 安装包。需要 Microsoft Edge WebView2 运行时（Win10 1803+ / Win11 自带）。"
            echo
            echo '- 文件名带 -setup.exe 的是 NSIS 单文件安装程序，静默安装加 /S'
            echo '- 文件名带 .msi 的是 Windows Installer 包，msiexec /i 包名.msi /qn 可无人值守部署'
            echo
            echo '数据和设置都在 %APPDATA%\workbench\ 下，卸载程序不会替你删它。'
            echo
            echo "## SHA-256"
            echo
            echo '```'
            for f in "${files[@]}"; do
              printf '%s  %s\n' "$(sha256sum "$f" | cut -d" " -f1)" "$(basename "$f")"
            done
            echo '```'
            echo
            echo '源码构建：npm ci，然后 npx tauri build，产物在 src-tauri/target/release/bundle 下。'
          } > release-notes.md
          cat release-notes.md

          # 同一个 tag 重跑时 Release 已存在：覆盖资产并改说明，不报错
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md "${files[@]}" \
            || { gh release upload "$TAG" --clobber "${files[@]}"; gh release edit "$TAG" --notes-file release-notes.md; }
