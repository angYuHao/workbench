[package]
name = "workbench"
version = "1.0.1"
description = "个人工作台 - 桌面整理 / 网址管理 / 文件管理"
authors = ["workbench"]
edition = "2021"

[lib]
name = "workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
# 唤醒快捷键：本机 cargo 缓存里已有 2.4.0 和它依赖的 global-hotkey 0.8.0，离线可解
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
notify = "7"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
sha2 = "0.10"
# 只要传输 + agent + 派生宏。TLS 用 native-tls（走 Windows 证书库），
# 默认的 rustls 只认自带根证书，内网做中间人时会握手失败
rig = { version = "0.44", default-features = false, features = ["reqwest", "native-tls", "agent", "derive"] }
# 联网查未知软件要用 HTTP 客户端：版本钉到 rig 已经在用的那个（本地缓存里有），
# 不下载新包；TLS 同样走 native-tls，和内网中间人证书的情况一致
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }

[dev-dependencies]
# 模型调用是 async 的，测试需要真运行时才能跑
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Registry",
    # 单实例那把命名互斥体
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
